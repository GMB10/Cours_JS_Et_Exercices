     <h1>

            <center>

                <br> <br>
                
            
            <br> <br>

                
            <button onclick="Verification()">Recherche</button>

                <p id="Recherche"></p>
                <script>
                    function Verification() 
                    {
                        let x = 0
                        let estpremier = true
                        let Nombre = Number(document.getElementById ("Nombre").value);
                        let Recherche = document.getElementById("Recherche");

                    for ( let i=1 ; i<=Nombre; i++) 
                    {
                    if ( Nombre % i == 0){
                        x = x+1

                    }

                    }
                    if ( x == 2) {
                        Recherche.textContent= "Il est premier"

                    }
                    else {
                        Recherche.textContent= "Il n'est premier"
                    }

                    }
